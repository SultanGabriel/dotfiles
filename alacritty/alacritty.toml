[shell]
args = ['--login']
program = "/bin/zsh"

[cursor]
style = "Beam"

[font]
size = 9.0

[font.normal]
# family = "RobotoMono Nerd Font"

[window]
startup_mode = "Windowed"
dynamic_padding = true
opacity = 1.0

[window.padding]
x = 6
y = 0

