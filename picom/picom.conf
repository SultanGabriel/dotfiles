# ===================================================================
# Performance related
# ===================================================================
backend = "glx";

glx-no-stencil = true;
blur-background = false;
# blur-method = "dual_kawase";

# glx-no-stencil = false;
glx-copy-from-front = false;
glx-swap-method = 1;

unredir-if-possible = true;

# ===================================================================
# Opacity Settings (⭐ NEU)
# ===================================================================
# Unfocused windows
inactive-opacity = 0.95;

# Focused window
active-opacity = 1.0;

# Frame opacity (borders, titlebars)
frame-opacity = 1.0;

# Don't change opacity of these window types
opacity-rule = [
    "100:class_g = 'slop'",              # Screenshot tool bleibt voll sichtbar
    "100:class_g = 'Visualizer'",         # Visualizer voll sichtbar
    "100:class_g = 'rofi'",               # Rofi launcher voll sichtbar
    "100:window_type = 'dock'",           # Panel/Bar voll sichtbar
    "100:window_type = 'desktop'",        # Desktop voll sichtbar
    "100:window_type = 'notification'",   # Notifications voll sichtbar
    "95:class_g = 'Alacritty' && focused", # Terminal focused = 95%
    "85:class_g = 'Alacritty' && !focused", # Terminal unfocused = 85%
    "100:class_g = 'firefox' && focused",  # Browser focused = 100%
    "90:class_g = 'firefox' && !focused"  # Browser unfocused = 90%
];

# ===================================================================
# Shadows
# ===================================================================
shadow = true;
detect-rounded-corners = false;

shadow-radius = 12;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-opacity = 0.2;
# Shadow color (optional)
shadow-red = 0.7;
shadow-green = 0.7;
shadow-blue = 1.0;

# ===================================================================
# Shadow Exclusions
# ===================================================================
shadow-exclude = [ 
    "class_g ?= 'slop'",
    "class_g ?= 'Visualizer'",
    "class_g ?= 'rofi'",
    "_NET_WM_STATE@:32a *= '_NET_WM_STATE_HIDDEN'",
    "window_type *= 'menu'",
    "window_type = 'utility'",
    "window_type = 'dock'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'"
];

# ===================================================================
# Fading (⭐ OPTIMIERT für smooth transitions)
# ===================================================================
fading = true;

# Fade in/out speed (höher = schneller, 0.01-0.1 gut)
fade-in-step = 0.08;   # 6% pro step
fade-out-step = 0.08;  # 6% pro step

# Time between steps in milliseconds (kleiner = smoother)
fade-delta = 20;  # 8ms = ~120 FPS

# Fade windows in/out when opening/closing
no-fading-openclose = false;

# ===================================================================
# Focus Exclusions
# ===================================================================
focus-exclude = [
    "class_g ?= 'slop'",
    "name = 'rofi'",
    "class_g ?= 'Steam'",
    "_NET_WM_WINDOW_TYPE@:a *= 'MENU'",
    "window_type *= 'menu'",
    "window_type = 'utility'",
    "window_type = 'dropdown_menu'",
    "window_type = 'popup_menu'"
];

fade-exclude = [];

# ===================================================================
# Advanced Settings (Optional aber nice)
# ===================================================================
# Detect WM windows and mark them as active
mark-wmwin-focused = true;

# Mark override-redirect windows as active
mark-ovredir-focused = true;

# Use EWMH to detect fullscreen windows
use-ewmh-active-win = true;

# Detect _NET_WM_WINDOW_TYPE to apply opacity rules
detect-client-opacity = true;

# Vertical synchronization
vsync = true;
