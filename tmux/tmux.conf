# Setting up the colors and copy/paste
set -g default-terminal "screen-256color"

# Set default shell
#set-option -g default-shell /bin/fish
set-option -g default-shell /bin/zsh


setw -g monitor-activity on

# Change prefix to 'CTRL-Y'
unbind C-b
set-option -g prefix C-y
bind-key C-y send-prefix

# history and mouse scrolling
set -g history-limit 100000

# Mouse support
set -g mouse on

# Start counting pane and window number at 1 
set -g base-index 1 
setw -g pane-base-index 1

# Setting up VIM pane / window management
setw -g mode-keys vi
unbind %
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file 
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded! 🚀"

# switch panes using Alt-arrow and Alt-HJKL without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Switch windows with Alt+1 ... Alt+9 without prefix
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# pane movement
bind-key o command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key b "break-pane -d"

# Tmuxswitch
#bind-key S run-shell "$HOME/scripts/tmuxswitch.sh"

