# Setting up the colors and copy/paste
set -g default-terminal "screen-256color"

# Set ZSH as default shell
set-option -g default-shell /bin/zsh

# Change prefix to 'CTRL-Y'
unbind C-b
set-option -g prefix C-y
bind-key C-y send-prefix

# history and mouse scrolling
set -g history-limit 100000
set mouse on

# Start counting pane and window number at 1 
set -g base-index 1 
setw -g pane-base-index 1

# Setting up VIM pane / window management
setw -g mode-keys vi
unbind %
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config file 
bind r source-file ~/.config/tmux/tmux.conf

# switch panes using Alt-arrow and Alt-HJKL without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D


# pane movement
bind-key o command-prompt -p "join pane from:"  "join-pane -s '%%'"
bind-key s command-prompt -p "send pane to:"  "join-pane -t '%%'"
bind-key b "break-pane -d"

# Setup status bar
# set -g status-justify centre
# set -g status-left-length 40
# set -g status-left "#[fg=green]Session: #S #[fg=yellow]#I #[fg=cyan]#P"

# Solarized Theme
set-option -g status-bg colour235 #base02
set-option -g status-fg colour136 #yellow

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

