# Status bar
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-left-length 20
set -g status-right-length 80

# Base colors
set -g status-style "bg=color66,fg=color255"

# Left side: session
#set -g status-left "#[bg=colour23,fg=colour235,bold]  » #S « #[bg=colour235,fg=colour33]"
set -g status-left "#[bg=colour23,fg=colour235,bold] λ » #S « #[default]"

# Normal windows

# #{?window_last_flag,󰁯 ,} \

setw -g window-status-format \
"#[fg=color23] #I.󰞷  #W \
#{?window_activity_flag,#[bg=color46]󰐕 ,}\
#{?window_bell_flag,#[fg=colors190]󰂞 ,}\
#{?window_silence_flag,󰒲 ,}\
#{?window_marked_flag,󰃀 ,}\
#{?window_zoomed_flag,#[fg=colors196]󰍉 ,}\
#[default]"

# Active window
setw -g window-status-current-format \
"#[bg=color23,fg=color235,bold,nounderscore] #I.󰞷  #W \
#{?window_activity_flag,#[fg=color46]󰐕 ,}\
#{?window_bell_flag,#[fg=color190]󰂞 ,}\
#{?window_silence_flag,󰒲 ,}\
#{?window_marked_flag,󰃀 ,}\
#{?window_zoomed_flag,#[fg=color196]󰍉 ,}\
#[default]"

# Right side
set -g status-right "#[fg=colour23,bold] #H  #[bg=colour23,fg=colour234]   %H:%M %d.%m.%Y "


